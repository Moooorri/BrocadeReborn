<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>&#38182;&#24207;&#26032;&#29983;</title>
  <style>:root {
  color-scheme: light;
  --ink: #1d2524;
  --muted: #61706b;
  --line: #c7d4cc;
  --paper: #fdf7f2;
  --panel: #d2e3e2;
  --panel-deep: #89b29c;
  --hover: #c7cb45;
  --active: #f98b3f;
  --white: #fffdf9;
  --shadow: 0 18px 44px rgba(29, 37, 36, 0.1);
  --font-display: "Songti SC", "SimSun", "Cormorant Garamond", "Times New Roman", serif;
  --font-body: "Microsoft YaHei", "PingFang SC", "Inter", "Helvetica Neue", Arial, sans-serif;
  --font-mono: "IBM Plex Mono", "SFMono-Regular", Consolas, "Liberation Mono", monospace;
  --ease-cut: cubic-bezier(0.75, 0, 0.25, 1);
  --ease-mask: cubic-bezier(0.75, 0, 0, 1);
  --duration-fast: 180ms;
  --duration-med: 600ms;
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  min-height: 100vh;
  overflow-x: hidden;
  overflow-y: auto;
  font-family: var(--font-body);
  color: var(--ink);
  background:
    linear-gradient(90deg, rgba(29, 37, 36, 0.055) 1px, transparent 1px) 50% 0 / 88px 100%,
    var(--paper);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

.app-shell {
  width: min(1540px, calc(100vw - 28px));
  min-height: 100vh;
  margin: 0 auto;
  padding: 12px 0 14px;
  display: grid;
  grid-template-columns: minmax(600px, 1fr) minmax(430px, 500px);
  grid-template-rows: 42px minmax(0, calc(100vh - 68px));
  gap: 14px clamp(28px, 3vw, 44px);
  align-items: stretch;
}

.top-nav {
  grid-column: 1 / -1;
  display: grid;
  grid-template-columns: 180px minmax(260px, 1fr) 180px;
  align-items: center;
  gap: 18px;
  position: relative;
  border-bottom: 1px solid rgba(29, 37, 36, 0.18);
}

.nav-pill,
.brand-lockup {
  min-height: 30px;
  border: 1px solid transparent;
  background: transparent;
}

.nav-pill {
  display: inline-grid;
  place-items: center;
  width: fit-content;
  min-width: 72px;
  padding: 0;
  color: var(--ink);
  font: inherit;
  font-weight: 500;
  font-size: 13px;
  letter-spacing: 0.04em;
  text-decoration: none;
  cursor: pointer;
  line-height: 1;
  text-transform: uppercase;
  transition: color var(--duration-med) var(--ease-cut), border-color var(--duration-fast) ease;
}

.nav-pill:last-child {
  justify-self: end;
  margin-right: 0;
}

.nav-pill:hover,
.nav-pill:focus-visible {
  border-color: transparent;
  background: transparent;
  color: var(--active);
  outline: 0;
}

.nav-pill:active {
  color: var(--active);
}

.brand-lockup {
  justify-self: center;
  width: min(360px, 100%);
  padding: 0;
  text-align: center;
}

.brand-lockup h1 {
  margin: 0;
  font-family: var(--font-display);
  font-size: clamp(28px, 2.85vw, 44px);
  line-height: 0.92;
  font-weight: 500;
  letter-spacing: 0;
}

.brand-lockup p {
  display: block;
  margin: 2px 0 0;
  color: var(--muted);
  font-family: var(--font-mono);
  font-size: 9px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

.stage {
  min-width: 0;
  min-height: 0;
  display: grid;
  grid-template-rows: minmax(0, 1fr) 72px;
  gap: 12px;
  justify-items: stretch;
}

.preview-frame {
  position: relative;
  display: grid;
  min-height: 0;
  place-items: center;
  padding: clamp(8px, 1.45vw, 18px);
  border: 1px solid rgba(29, 37, 36, 0.18);
  background:
    linear-gradient(180deg, rgba(253, 247, 242, 0.2), rgba(137, 178, 156, 0.2)),
    rgba(210, 227, 226, 0.62);
  overflow: hidden;
}

.preview-frame::before,
.preview-frame::after {
  position: absolute;
  z-index: 1;
  color: rgba(29, 37, 36, 0.42);
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.06em;
  pointer-events: none;
  writing-mode: vertical-rl;
}

.preview-frame::before {
  content: "01 / PATTERN";
  left: 10px;
  top: 12px;
}

.preview-frame::after {
  content: "800 x 800";
  right: 10px;
  bottom: 12px;
  transform: rotate(180deg);
}

canvas {
  display: block;
  width: min(100%, 78vh);
  max-height: 100%;
  aspect-ratio: 1;
  height: auto;
  background: var(--paper);
  border: 1px solid rgba(29, 37, 36, 0.12);
  box-shadow: none;
}

.status {
  position: absolute;
  left: 16px;
  bottom: 16px;
  max-width: calc(100% - 32px);
  padding: 8px 12px;
  border: 1px solid rgba(29, 37, 36, 0.16);
  color: var(--ink);
  background: rgba(253, 247, 242, 0.92);
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.02em;
}

.status:empty {
  display: none;
}

.info-panel {
  display: block;
  width: 100%;
}

.info {
  margin: 0;
  min-height: 72px;
  padding: 10px 0;
  display: grid;
  grid-template-columns: minmax(150px, 1fr) minmax(120px, 0.9fr) minmax(78px, 0.55fr) minmax(180px, 1.25fr);
  gap: 0;
  border-top: 1px solid rgba(29, 37, 36, 0.18);
  border-bottom: 1px solid rgba(29, 37, 36, 0.18);
  background: rgba(210, 227, 226, 0.74);
}

.info > div {
  min-width: 0;
  display: grid;
  gap: 5px;
  align-content: start;
  padding: 0 14px;
  border-right: 1px solid rgba(29, 37, 36, 0.14);
}

.info > div:last-child {
  border-right: 0;
}

.info dt {
  color: var(--muted);
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.06em;
  text-align: center;
}

.info dd {
  margin: 0;
  min-height: 28px;
  color: var(--ink);
  font-size: 12px;
  line-height: 1.45;
  text-align: center;
  overflow-wrap: anywhere;
}

.info dd:has(.asset-preview-list) {
  display: flex;
  justify-content: center;
  min-width: 0;
}

.panel {
  position: relative;
  min-height: 0;
  display: grid;
  border: 1px solid rgba(29, 37, 36, 0.22);
  background: rgba(210, 227, 226, 0.62);
}

.side-stack {
  min-height: 0;
  max-height: calc(100vh - 58px);
  display: grid;
  grid-template-rows: minmax(0, 1fr) 72px;
  gap: 12px;
  align-self: stretch;
  position: sticky;
  top: 10px;
}

.parameter-stack {
  min-height: 0;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr);
  gap: 10px;
}

.panel-scroll {
  min-height: 0;
  height: 100%;
  max-height: 100%;
  overflow-y: auto;
  overflow-x: hidden;
  scrollbar-color: var(--panel-deep) transparent;
  scrollbar-width: thin;
}

.panel-scroll::-webkit-scrollbar,
.option-strip::-webkit-scrollbar,
.segmented-control::-webkit-scrollbar {
  width: 8px;
  height: 8px;
}

.panel-scroll::-webkit-scrollbar-thumb,
.option-strip::-webkit-scrollbar-thumb,
.segmented-control::-webkit-scrollbar-thumb {
  background: var(--panel-deep);
}

.controls {
  display: grid;
  padding: 0;
  min-width: 0;
  width: 100%;
}

.button,
select,
input[type="range"] {
  width: 100%;
}

.button {
  min-height: 48px;
  border: 1px solid rgba(29, 37, 36, 0.24);
  color: var(--ink);
  background: rgba(253, 247, 242, 0.56);
  font: inherit;
  font-size: 13px;
  font-weight: 500;
  letter-spacing: 0.04em;
  cursor: pointer;
  text-transform: uppercase;
  transition: background var(--duration-fast) ease, border-color var(--duration-fast) ease, color var(--duration-fast) ease, transform var(--duration-fast) ease;
}

.button:disabled {
  cursor: progress;
  opacity: 0.66;
}

.button:hover,
.button:focus-visible {
  border-color: var(--ink);
  background: rgba(199, 203, 69, 0.78);
  outline: 0;
}

.button:active {
  border-color: var(--active);
  background: var(--active);
  transform: translateY(1px);
}

.button.primary {
  background: var(--panel-deep);
  border-color: var(--panel-deep);
}

.button.secondary {
  font-size: 12px;
  background: transparent;
}

.field {
  display: grid;
  gap: 8px;
  color: var(--muted);
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.02em;
}

.text-input {
  min-height: 34px;
  padding: 0 10px;
  border: 1px solid var(--panel-deep);
  color: var(--ink);
  background: rgba(253, 247, 242, 0.72);
  font: inherit;
}

.field > span,
.segmented-field legend {
  padding: 0;
  color: var(--ink);
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.04em;
}

.control-section {
  display: grid;
  gap: 13px;
  padding: 18px 22px 22px;
  border-bottom: 1px solid rgba(29, 37, 36, 0.18);
}

.control-section:last-child {
  border-bottom: 0;
}

.control-section-title {
  margin: 0;
  color: var(--ink);
  font-family: var(--font-display);
  font-size: 28px;
  line-height: 0.95;
  font-weight: 500;
  letter-spacing: 0;
}

.skeleton-section {
  grid-template-columns: 1fr;
}

.skeleton-section .control-section-title,
.skeleton-section .range-field {
  grid-column: auto;
}

.ground-section {
  grid-template-columns: 1fr 1fr;
}

.palette-section {
  grid-template-columns: 1fr 1fr;
}

.palette-section .control-section-title,
.palette-section .palette-color-grid,
.palette-section .palette-actions {
  grid-column: 1 / -1;
}

.palette-color-grid {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 8px;
}

.palette-color-grid label {
  display: grid;
  gap: 5px;
  min-width: 0;
  color: var(--muted);
  font-family: var(--font-mono);
  font-size: 10px;
}

.palette-color-grid .palette-role {
  color: var(--white);
  font-family: var(--font-ui);
  font-size: 10px;
  line-height: 1.1;
}

.palette-color-grid .palette-code {
  color: var(--muted);
  font-family: var(--font-mono);
  font-size: 10px;
  line-height: 1.1;
  text-transform: uppercase;
}

.palette-color-input {
  width: 100%;
  height: 34px;
  padding: 0;
  border: 1px solid var(--panel-deep);
  background: transparent;
}

.small-button {
  min-height: 32px;
  border: 1px solid var(--panel-deep);
  color: var(--ink);
  background: rgba(253, 247, 242, 0.72);
  font: inherit;
  font-size: 12px;
  cursor: pointer;
}

.palette-actions {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}

.small-button.danger {
  border-color: var(--active);
}

.small-button:hover,
.small-button:focus-visible {
  background: var(--hover);
  outline: 0;
}

.ground-section .control-section-title,
.ground-section .segmented-field,
.ground-section .range-field,
.ground-section .color-field {
  grid-column: 1 / -1;
}

.action-panel,
.share-panel {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  background: transparent;
}

.action-panel .button {
  min-height: 38px;
  font-size: 11px;
  background: rgba(210, 227, 226, 0.9);
}

.share-panel .button {
  min-height: 72px;
  background: rgba(210, 227, 226, 0.9);
}

.recipe-card-preview[hidden] {
  display: none;
}

.recipe-card-preview {
  position: fixed;
  right: 32px;
  bottom: 104px;
  z-index: 20;
  width: min(320px, calc(100vw - 48px));
  padding: 12px;
  border: 1px solid var(--panel-deep);
  background: var(--paper);
  box-shadow: 0 18px 44px rgba(29, 37, 36, 0.18);
}

.recipe-card-placeholder {
  min-height: 420px;
  padding: 0;
  display: grid;
  grid-template-rows: 1fr auto;
  overflow: hidden;
  border: 1px solid var(--card-accent, var(--panel-deep));
  background: var(--card-soft, var(--paper));
}

.recipe-card-art {
  min-height: 250px;
  padding: 14px;
  display: grid;
  place-items: center;
  background:
    linear-gradient(90deg, color-mix(in srgb, var(--card-accent, #89B29C) 16%, transparent) 1px, transparent 1px) 0 0 / 28px 28px,
    linear-gradient(180deg, color-mix(in srgb, var(--card-accent, #89B29C) 16%, transparent) 1px, transparent 1px) 0 0 / 28px 28px,
    color-mix(in srgb, var(--card-soft, #FDF7F2) 82%, white);
}

.recipe-card-art img {
  width: 100%;
  aspect-ratio: 1;
  object-fit: cover;
  border: 1px solid color-mix(in srgb, var(--card-accent, #89B29C) 76%, var(--ink));
  background: var(--paper);
}

.recipe-card-body {
  padding: 16px 18px 18px;
  display: grid;
  gap: 9px;
  color: var(--card-ink, var(--ink));
  background: color-mix(in srgb, var(--card-soft, #FDF7F2) 88%, white);
}

.recipe-card-heading {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 28px;
  align-items: start;
  gap: 12px;
}

.recipe-card-kicker {
  color: color-mix(in srgb, var(--card-ink, var(--ink)) 62%, white);
  font-size: 10px;
  letter-spacing: 0.08em;
}

.recipe-card-title {
  margin-top: 4px;
  font-family: "Songti SC", "SimSun", serif;
  font-size: 19px;
  line-height: 1.18;
  font-weight: 700;
}

.recipe-card-subtitle {
  font-size: 12px;
  color: color-mix(in srgb, var(--card-ink, var(--ink)) 76%, white);
}

.recipe-card-seal {
  width: 26px;
  height: 26px;
  border: 1px solid var(--card-accent, var(--ink));
  background:
    radial-gradient(circle, var(--card-accent, #89B29C) 0 32%, transparent 34%),
    linear-gradient(45deg, transparent 40%, var(--card-accent, #89B29C) 41% 58%, transparent 59%),
    linear-gradient(-45deg, transparent 40%, var(--card-accent, #89B29C) 41% 58%, transparent 59%);
}

.recipe-card-marks {
  display: grid;
  grid-template-columns: repeat(5, 22px);
  gap: 12px;
  align-items: center;
}

.recipe-card-marks span {
  width: 18px;
  height: 18px;
  display: block;
  border: 1px solid var(--card-accent, #89B29C);
  background: color-mix(in srgb, var(--card-accent, #89B29C) 78%, white);
}

.recipe-card-marks span:nth-child(1),
.recipe-card-marks span:nth-child(4) {
  transform: rotate(45deg);
}

.recipe-card-marks span:nth-child(2),
.recipe-card-marks span:nth-child(5) {
  border-radius: 50%;
  background: transparent;
}

.recipe-card-marks span:nth-child(3) {
  background:
    linear-gradient(45deg, transparent 42%, var(--card-accent, #89B29C) 43% 57%, transparent 58%),
    linear-gradient(-45deg, transparent 42%, var(--card-accent, #89B29C) 43% 57%, transparent 58%);
}

.recipe-card-id {
  font-family: "Songti SC", "SimSun", serif;
  font-size: 12px;
  letter-spacing: 0.08em;
  color: color-mix(in srgb, var(--card-ink, var(--ink)) 62%, white);
}

.recipe-card-grid {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 5px 12px;
  font-size: 11px;
  line-height: 1.45;
}

.recipe-card-grid span {
  color: color-mix(in srgb, var(--card-ink, var(--ink)) 58%, white);
}

.recipe-card-grid strong {
  min-width: 0;
  font-weight: 600;
}

.recipe-card-placeholder p {
  margin: 0;
  padding-top: 2px;
  border-top: 1px solid color-mix(in srgb, var(--card-accent, #89B29C) 52%, transparent);
  font-size: 11px;
  line-height: 1.55;
}

.native-select {
  position: absolute;
  width: 1px;
  height: 1px;
  opacity: 0;
  pointer-events: none;
}

select {
  min-height: 42px;
  padding: 0 12px;
  border: 1px solid var(--line);
  color: var(--ink);
  background: var(--white);
  font: inherit;
}

.option-strip {
  display: flex;
  flex-direction: row;
  flex-wrap: nowrap;
  gap: 6px;
  overflow-x: auto;
  overscroll-behavior-inline: contain;
  scroll-snap-type: x proximity;
  scrollbar-width: thin;
  padding: 6px 0;
  border-top: 1px solid rgba(29, 37, 36, 0.16);
  border-bottom: 1px solid rgba(29, 37, 36, 0.16);
  background: transparent;
}

.option-chip {
  flex: 0 0 auto;
  width: auto;
  min-width: 124px;
  min-height: 36px;
  padding: 7px 10px;
  border: 1px solid rgba(29, 37, 36, 0.2);
  color: var(--ink);
  background: rgba(253, 247, 242, 0.42);
  font: inherit;
  font-family: var(--font-body);
  font-size: 12px;
  line-height: 1.25;
  text-align: left;
  cursor: pointer;
  scroll-snap-align: start;
  transition: background var(--duration-fast) ease, border-color var(--duration-fast) ease, color var(--duration-fast) ease;
}

.option-chip:hover,
.option-chip:focus-visible {
  border-color: var(--ink);
  background: rgba(199, 203, 69, 0.72);
  outline: 0;
}

.option-chip:active {
  background: var(--active);
}

.option-chip.is-selected {
  border-color: var(--ink);
  background: var(--panel-deep);
  box-shadow: inset 0 -3px 0 var(--paper);
}

.option-chip.is-current-result {
  color: var(--active);
  font-weight: 700;
}

.color-current {
  width: 100%;
  min-height: 32px;
  display: grid;
  place-items: center;
  border: 1px solid rgba(29, 37, 36, 0.22);
  color: var(--ink);
  font-family: var(--font-mono);
  font-size: 11px;
  background:
    linear-gradient(rgba(253, 247, 242, calc(1 - var(--preview-opacity, 1))), rgba(253, 247, 242, calc(1 - var(--preview-opacity, 1)))),
    var(--preview-color, var(--panel-deep));
  cursor: default;
  user-select: none;
}

.color-strip .option-chip {
  flex: 1 0 52px;
  min-width: 52px;
  width: auto;
  color: var(--paper);
  position: relative;
  background: var(--chip-color, var(--paper));
  text-align: center;
  font-size: 10px;
  font-weight: 600;
}

.color-strip .option-chip.is-light-chip {
  color: var(--ink);
}

.color-strip .option-chip.is-random-chip {
  color: var(--ink);
  background:
    linear-gradient(135deg, var(--palette-0, #89B29C) 0 20%, var(--palette-1, #D2E3E2) 20% 40%, var(--palette-2, #FDF7F2) 40% 60%, var(--palette-3, #C7CB45) 60% 80%, var(--palette-4, #F98B3F) 80% 100%);
}

.color-strip .option-chip::after {
  content: "";
  position: absolute;
  inset: 6px;
  border: 1px solid rgba(29, 37, 36, 0.28);
  pointer-events: none;
}

.color-strip .option-chip.is-selected {
  box-shadow: inset 0 0 0 3px var(--paper);
}

.color-strip {
  flex-wrap: nowrap;
  overflow-x: auto;
  scrollbar-width: none;
}

.color-strip::-webkit-scrollbar {
  display: none;
}

.segmented-field {
  margin: 0;
  padding: 0;
  border: 0;
}

.segmented-control {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding: 0 0 8px;
}

.segmented-control label {
  position: relative;
  min-width: 0;
  overflow: hidden;
}

.segmented-control input {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  margin: 0;
  opacity: 0;
  pointer-events: none;
}

.segmented-control span {
  display: grid;
  min-width: 88px;
  min-height: 36px;
  place-items: center;
  border: 1px solid rgba(29, 37, 36, 0.22);
  color: var(--ink);
  background: rgba(253, 247, 242, 0.42);
  font-family: var(--font-body);
  font-size: 12px;
  cursor: pointer;
}

.segmented-control span:hover {
  background: var(--hover);
}

.segmented-control input:checked + span {
  background: var(--panel-deep);
  border-color: var(--ink);
  box-shadow: inset 0 -3px 0 var(--paper);
}

.range-field span {
  display: flex;
  justify-content: space-between;
  gap: 12px;
}

input[type="range"] {
  height: 24px;
  accent-color: var(--panel-deep);
}

.asset-preview-list {
  display: flex;
  flex-direction: row;
  flex-wrap: nowrap;
  gap: 10px;
  align-items: center;
  justify-content: center;
  overflow-x: auto;
  padding-bottom: 2px;
}

.info .asset-preview-list {
  display: flex;
  flex-direction: row;
  width: auto;
  max-width: 100%;
  min-width: 0;

    gap: 10px;
  }

  .top-nav {
    grid-template-columns: 1fr 1fr;
    min-height: auto;
  }

  .top-nav::before,
  .top-nav::after {
    display: none;
  }

  .brand-lockup {
    min-height: 58px;
    border-bottom: var(--hair) solid var(--ink);
  }

  .nav-pill {
    min-height: 46px;
    height: 46px;
    border-right: var(--hair) solid var(--ink);
  }

  .nav-pill:last-child {
    border-right: 0;
  }

  .info {
    grid-template-columns: 1fr;
  }

  .info > div {
    border-right: 0;
    border-bottom: var(--hair) solid var(--ink);
  }

  .info > div:last-child {
    border-bottom: 0;
  }

  .action-panel,
  .share-panel {
    grid-template-columns: 1fr;
  }

  .action-panel .button,
  .share-panel .button {
    border-right: 0;
    border-bottom: var(--hair) solid var(--ink);
  }

  .action-panel .button:last-child,
  .share-panel .button:last-child {
    border-bottom: 0;
  }

  .control-section-title {
    font-size: 18px;
  }

  .palette-color-grid {
    grid-template-columns: 1fr;
  }

  .palette-color-grid label {
    border-right: 0;
    border-bottom: var(--hair) solid var(--ink);
  }

  .palette-color-grid label:last-child {
    border-bottom: 0;
  }
}

/* Final fixed-screen dark editorial shell */
:root {
  color-scheme: dark;
  --ink: #fff0c8;
  --muted: rgba(255, 240, 200, 0.62);
  --line: rgba(255, 240, 200, 0.24);
  --paper: #1b1b18;
  --panel: #22231f;
  --panel-deep: #fff0c8;
  --hover: #c7cb45;
  --active: #f98b3f;
  --white: #fff7e5;
  --shadow: none;
}

html,
body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #1b1b18;
}

body {
  min-height: 0;
  color: var(--ink);
  background:
    linear-gradient(90deg, rgba(255, 240, 200, 0.055) 1px, transparent 1px) 50% 0 / 84px 100%,
    linear-gradient(180deg, rgba(255, 240, 200, 0.035) 1px, transparent 1px) 0 50% / 100% 84px,
    #1b1b18;
}

.app-shell {
  width: min(1680px, calc(100vw - 24px));
  height: 100vh;
  min-height: 0;
  padding: 0 0 12px;
  grid-template-columns: minmax(620px, 1fr) minmax(420px, 520px);
  grid-template-rows: 58px minmax(0, 1fr);
  gap: 12px;
  overflow: hidden;
}

.top-nav {
  min-height: 58px;
  border-color: var(--line);
  background: rgba(27, 27, 24, 0.94);
  color: var(--ink);
}

.top-nav::before,
.top-nav::after {
  background: var(--line);
}

.nav-pill {
  height: 58px;
  color: var(--ink);
}

.nav-pill:hover,
.nav-pill:focus-visible {
  color: #1b1b18;
  background: var(--ink);
}

.brand-lockup h1 {
  color: var(--ink);
}

.stage,
.side-stack,
.content-page {
  min-height: 0;
}

.stage {
  grid-template-rows: minmax(0, 1fr) 84px;
}

.side-stack {
  max-height: none;
  position: static;
}

.preview-frame,
.panel,
.info,
.action-panel .button,
.share-panel .button,
.recipe-card-preview {
  border-color: var(--line);
  background: rgba(255, 240, 200, 0.06);
}

.preview-frame {
  overflow: hidden;
}

canvas {
  width: min(100%, calc(100vh - 174px));
  background: #fff7e5;
}

.info > div,
.action-panel .button,
.share-panel .button,
.control-section,
.option-strip,
.segmented-control,
.text-input,
.color-current,
.asset-thumb,
.small-button,
.field input[type="color"],
.field input[type="range"] {
  border-color: var(--line);
}

.panel-scroll {
  height: 100%;
  max-height: 100%;
  overflow-y: auto;
  scrollbar-color: var(--ink) transparent;
}

.control-section {
  background: rgba(255, 240, 200, 0.035);
  border-bottom-color: rgba(255, 240, 200, 0.14);
}

.button,
.small-button,
.option-chip,
.text-input,
select {
  color: var(--ink);
  background: rgba(255, 240, 200, 0.055);
}

.button:hover,
.button:focus-visible,
.small-button:hover,
.small-button:focus-visible,
.option-chip:hover,
.option-chip:focus-visible {
  color: #1b1b18;
  background: var(--ink);
}

.option-chip.is-selected {
  color: #1b1b18;
  background: var(--ink);
  box-shadow: none;
}

.color-strip .option-chip.is-selected {
  box-shadow: inset 0 0 0 3px #1b1b18;
}

.content-page {
  display: none;
  grid-column: 1 / -1;
  grid-row: 2;
  position: relative;
  border: 1px solid var(--line);
  background: rgba(255, 240, 200, 0.035);
}

.back-button {
  position: absolute;
  left: 24px;
  top: 20px;
  min-width: 92px;
  height: 42px;
  border: 1px solid var(--line);
  color: var(--ink);
  background: transparent;
  font: inherit;
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
}

.back-button:hover,
.back-button:focus-visible {
  color: #1b1b18;
  background: var(--ink);
  outline: 0;
}

body[data-page="info"] .stage,
body[data-page="info"] .side-stack,
body[data-page="about"] .stage,
body[data-page="about"] .side-stack {
  display: none;
}

body[data-page="info"] .content-page-info,
body[data-page="about"] .content-page-about {
  display: block;
}

@media (max-width: 1180px) {
  body {
    height: 100%;
    min-height: 0;
    overflow: hidden;
  }

  .app-shell {
    height: 100vh;
    min-height: 0;
    grid-template-columns: 1fr;
    grid-template-rows: auto minmax(0, 1fr) minmax(0, 0.9fr);
  }

  .side-stack {
    max-height: none;
    min-height: 0;
    overflow: hidden;
  }

  .panel-scroll {
    max-height: 100%;
  }
}

function captureViewportState() {
  return {
    x: window.scrollX,
    y: window.scrollY,
    panelTop: panelScroll ? panelScroll.scrollTop : 0,
  };
}

function restoreViewportState(stateSnapshot) {
  const restore = () => {
    window.scrollTo(stateSnapshot.x, stateSnapshot.y);
    if (panelScroll) {
      panelScroll.scrollTop = stateSnapshot.panelTop;
    }
  };

  restore();
  requestAnimationFrame(restore);
  window.setTimeout(restore, 60);
}

function runWithoutJump(action) {
  const stateSnapshot = captureViewportState();
  const result = action();
  Promise.resolve(result).finally(() => restoreViewportState(stateSnapshot));
  return result;
}

function preventPreviewLabelJump(element) {
  if (!element) return;

  ["pointerdown", "mousedown", "touchstart", "click"].forEach((eventName) => {
    element.addEventListener(eventName, (event) => {
      event.preventDefault();
      event.stopPropagation();
      restoreViewportState(captureViewportState());
    }, { passive: false });
  });
}

function installKioskTouchGuards() {
  const viewport = document.querySelector('meta[name="viewport"]');
  if (viewport) {
    viewport.setAttribute(
      "content",
      "width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover"
    );
  }

  const stopZoom = (event) => {
    event.preventDefault();
  };

  ["gesturestart", "gesturechange", "gestureend"].forEach((eventName) => {
    document.addEventListener(eventName, stopZoom, { passive: false });
  });

  document.addEventListener("touchstart", (event) => {
    if (event.touches.length > 1) {
      event.preventDefault();
    }
  }, { passive: false });

  document.addEventListener("touchmove", (event) => {
    if (event.touches.length > 1) {
      event.preventDefault();
    }
  }, { passive: false });

  document.addEventListener("wheel", (event) => {
    if (event.ctrlKey) {
      event.preventDefault();
    }
  }, { passive: false });

  document.addEventListener("dblclick", stopZoom, { passive: false });

  let lastTouchEnd = 0;
  document.addEventListener("touchend", (event) => {
    const now = Date.now();
    if (now - lastTouchEnd <= 350) {
      event.preventDefault();
    }
    lastTouchEnd = now;
  }, { passive: false });

  let touchStartY = 0;
  let touchScrollable = null;

  const findScrollableAncestor = (element) => {
    let node = element;
    while (node && node !== document.body && node !== document.documentElement) {
      const style = window.getComputedStyle(node);
      const canScrollY = /(auto|scroll)/.test(style.overflowY) && node.scrollHeight > node.clientHeight;
      if (canScrollY) {
        return node;
      }
      node = node.parentElement;
    }
    return null;
  };

  document.addEventListener("touchstart", (event) => {
    if (event.touches.length !== 1) return;
    touchStartY = event.touches[0].clientY;
    touchScrollable = findScrollableAncestor(event.target);
  }, { passive: true });

  document.addEventListener("touchmove", (event) => {
    if (event.touches.length !== 1) return;
    if (event.target instanceof Element && event.target.closest("input, select, textarea")) return;

    const deltaY = event.touches[0].clientY - touchStartY;
    if (!touchScrollable) {
      event.preventDefault();
      return;
    }

    const atTop = touchScrollable.scrollTop <= 0;
    const atBottom = touchScrollable.scrollTop + touchScrollable.clientHeight >= touchScrollable.scrollHeight - 1;
    if ((atTop && deltaY > 0) || (atBottom && deltaY < 0)) {
      event.preventDefault();
    }
  }, { passive: false });

  const keepViewportPinned = () => {
    window.scrollTo(0, 0);
    document.documentElement.scrollTop = 0;
    document.body.scrollTop = 0;
  };

  window.addEventListener("orientationchange", keepViewportPinned);
  window.addEventListener("resize", keepViewportPinned);
  if (window.visualViewport) {
    window.visualViewport.addEventListener("scroll", keepViewportPinned);
    window.visualViewport.addEventListener("resize", keepViewportPinned);
  }
}

      input.value = targetColors[index];

      const text = label && label.querySelector(".palette-code");
      if (text) {

    const index = Number(input.dataset.paletteIndex);
    if (Number.isInteger(index) && colors[index]) {
      colors[index] = normalizeHex(input.value);

  return colors;
}

function getSelectedPaletteColor(select, fallback) {
  if (!select || select.value === "random") return randomColor();
  const selectedOption = select.selectedOptions && select.selectedOptions[0];

  if (Number.isInteger(paletteIndex) && targetColors[paletteIndex]) {
    return targetColors[paletteIndex];
  }
  return select.value || fallback;
}

  setSavedPalettes(saved);
  renderPalettePresetOptions();

    palettePresetSelect.value = String(saved.findIndex((palette) => palette.name === name));

function hexToRgb(hex) {
  const clean = hex.replace("#", "").trim();
  if (clean.length === 3) {
    return clean.split("").map((value) => parseInt(value + value, 16));
  }
  return [
    parseInt(clean.slice(0, 2), 16),
    parseInt(clean.slice(2, 4), 16),
    parseInt(clean.slice(4, 6), 16),
  ];
}

function distance(a, b) {
  return (a[0] - b[0]) ** 2 + (a[1] - b[1]) ** 2 + (a[2] - b[2]) ** 2;
}

function nearestTargetColor(sourceColor) {
  const rgb = hexToRgb(sourceColor);
  const templates = templateColors.map(hexToRgb);
  let bestIndex = 0;
  let bestDistance = Number.POSITIVE_INFINITY;

  templates.forEach((template, index) => {
    const score = distance(rgb, template);
    if (score < bestDistance) {
      bestDistance = score;
      bestIndex = index;
    }
  });

  return targetColors[bestIndex];
}

function recolorSvgText(svgText, options = {}) {
  const parser = new DOMParser();
  const doc = parser.parseFromString(svgText, "image/svg+xml");
  const svg = doc.documentElement;
  const nodes = svg.querySelectorAll("*");

  nodes.forEach((node) => {
    const fill = node.getAttribute("fill");
    const stroke = node.getAttribute("stroke");

    if (fill && fill !== "none" && fill.startsWith("#")) {
      node.setAttribute("fill", options.ground ? options.groundColor || targetColors[0] : nearestTargetColor(fill));
    }

    if (stroke && stroke !== "none" && (options.ground || stroke.startsWith("#"))) {
      const mappedStroke = options.ground ? options.groundColor || targetColors[0] : nearestTargetColor(stroke);
      node.setAttribute("stroke", mappedStroke);
      if (options.ground) {
        node.setAttribute("stroke-opacity", "1");
        const currentWidth = parseFloat(node.getAttribute("stroke-width") || "0.6");
        const scale = options.groundStrokeScale || 1;
        node.setAttribute("stroke-width", String(Math.max(currentWidth * scale, 0.35)));
      }
    }
  });

  return new XMLSerializer().serializeToString(svg);
}

function svgTextToMonoLineDataUrl(svgText) {
  const parser = new DOMParser();
  const doc = parser.parseFromString(svgText, "image/svg+xml");
  const svg = doc.documentElement;
  const nodes = svg.querySelectorAll("*");

  svg.setAttribute("preserveAspectRatio", "xMidYMid meet");
  nodes.forEach((node) => {
    if (node.tagName.toLowerCase() === "defs") return;
    node.setAttribute("fill", "none");
    node.setAttribute("stroke", "#111111");
    node.setAttribute("stroke-width", "2");
    node.setAttribute("stroke-opacity", "1");
    node.setAttribute("vector-effect", "non-scaling-stroke");
    node.removeAttribute("opacity");
    node.removeAttribute("fill-opacity");
  });

  return `data:image/svg+xml;charset=utf-8,${encodeURIComponent(new XMLSerializer().serializeToString(svg))}`;
}

function getAssetPreviewItem(label, url) {

    subOffsets.forEach((offset) => {
      const index = getWrappedIndex(state.idxSub, offset, SUB_MOTIF_NUM);
      items.push(getAssetPreviewItem(`Sc${index + 1}`, `${assetBase}/sub_motifs/sc${index + 1}_A.svg`));
    });
    mainOffsets.forEach((offset) => {
      const index = getWrappedIndex(state.idxMain, offset, MAIN_MOTIF_NUM);
      items.push(getAssetPreviewItem(`Sb${index + 1}`, `${assetBase}/main_motifs/sb${index + 1}_A.svg`));
    });
    assetInfo.innerHTML = `<div class="asset-preview-list">${items.join("")}</div>`;
    return;
  }
  if (state.currentSkeletonLayout === 7) {
    const nextMainIndex = getWrappedIndex(state.idxMain, 1, MAIN_MOTIF_NUM);
    items.push(getAssetPreviewItem(`Sc${state.idxSub + 1}`, `${assetBase}/sub_motifs/sc${state.idxSub + 1}_A.svg`));
    items.push(getAssetPreviewItem(`Sb${state.idxMain + 1}`, `${assetBase}/main_motifs/sb${state.idxMain + 1}_A.svg`));
    items.push(getAssetPreviewItem(`Sb${nextMainIndex + 1}`, `${assetBase}/main_motifs/sb${nextMainIndex + 1}_A.svg`));
    assetInfo.innerHTML = `<div class="asset-preview-list">${items.join("")}</div>`;
    return;
  }
  if (state.currentSkeletonLayout === 8) {
    [0, 1, 2, 3].forEach((offset) => {
      const index = getWrappedIndex(state.idxMain, offset, MAIN_MOTIF_NUM);
      items.push(getAssetPreviewItem(`Sb${index + 1}`, `${assetBase}/main_motifs/sb${index + 1}_A.svg`));
    });
    assetInfo.innerHTML = `<div class="asset-preview-list">${items.join("")}</div>`;
    return;
  }

  items.push(getAssetPreviewItem(`Sc${state.idxSub + 1}`, `${assetBase}/sub_motifs/sc${state.idxSub + 1}_A.svg`));
  if (state.currentSkeletonLayout === 4) {
    const cIndex = (state.idxSub + 3) % SUB_MOTIF_NUM;
    items.push(getAssetPreviewItem(`Sc${cIndex + 1}`, `${assetBase}/sub_motifs/sc${cIndex + 1}_A.svg`));
  }
  items.push(getAssetPreviewItem(`Sb${state.idxMain + 1}`, `${assetBase}/main_motifs/sb${state.idxMain + 1}_A.svg`));
  assetInfo.innerHTML = `<div class="asset-preview-list">${items.join("")}</div>`;
}

function getPatternId() {
  const parts = [
    state.currentSkeletonLayout,
    state.currentSkeletonStyle,
    state.lineWidth,
    state.drawGround ? 1 : 0,
    state.drawGround ? state.idxGround : 0,
    state.idxSub,
    state.idxMain,
    state.groundSize,
    Math.round(state.groundOpacity * 100),
    Math.round(state.groundStrokeScale * 10),
    targetColors.indexOf(state.groundColor),
    targetColors.indexOf(state.backgroundColor),
  ];
  let hash = 0;
  parts.join("-").split("").forEach((char) => {
    hash = ((hash * 31) + char.charCodeAt(0)) >>> 0;
  });
  return `JXNS-${hash.toString(36).toUpperCase().padStart(6, "0").slice(-6)}`;
}

function escapeHtml(value) {

    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")

}

function getSelectForStrip(strip) {
  return document.querySelector(`#${strip.dataset.selectTarget}`);
}

function syncOptionStrip(strip) {
  const select = getSelectForStrip(strip);
  if (!select) return;

  const target = strip.dataset.selectTarget;
  const resultValue = target === "layoutSelect"
    ? String(state.currentSkeletonLayout)
    : target === "skeletonStyleSelect"
      ? String(state.currentSkeletonStyle)
      : target === "groundColor"
        ? state.groundColor
        : target === "backgroundColor"
          ? state.backgroundColor
          : target === "recipeCardStyle"
            ? state.recipeCardStyle
            : target === "recipeCardTheme"
              ? String(state.recipeCardTheme)
              : null;

  strip.querySelectorAll(".option-chip").forEach((chip) => {
    const isSelected = chip.dataset.value === select.value;
    const isCurrentResult = resultValue !== null && chip.dataset.value === resultValue && !isSelected;
    chip.classList.toggle("is-selected", isSelected);
    chip.classList.toggle("is-current-result", isCurrentResult);
    chip.setAttribute("aria-selected", String(isSelected));
    chip.tabIndex = isSelected ? 0 : -1;
  });
}

function syncOptionStrips() {
  optionStrips.forEach(syncOptionStrip);
}

function createOptionChip(option, select) {
  const chip = document.createElement("button");
  chip.type = "button";
  chip.className = "option-chip";
  chip.dataset.value = option.value;
  chip.setAttribute("role", "option");
  chip.textContent = option.textContent;
  if (select.id === "groundColor" || select.id === "backgroundColor") {
    chip.style.setProperty("--chip-color", option.value);
    chip.classList.toggle("is-random-chip", option.value === "random");
    chip.classList.toggle("is-light-chip", option.value !== "random" && isLightColor(option.value));
  } else if (select.id === "recipeCardTheme") {
    const theme = figmaCardThemes[Number(option.value)];
    if (theme) {
      chip.style.setProperty("--chip-color", theme.accent);
      chip.classList.add("is-card-theme-chip");
      chip.classList.toggle("is-light-chip", isLightColor(theme.accent));
    }
  }
  chip.addEventListener("mousedown", (event) => {
    event.preventDefault();
  });
  chip.addEventListener("touchstart", () => {}, { passive: true });
  chip.addEventListener("click", (event) => {
    event.preventDefault();
    select.value = option.value;
    runWithoutJump(() => {
      select.dispatchEvent(new Event("change", { bubbles: true }));
    });
  });
  chip.addEventListener("keydown", (event) => {
    if (event.key !== "ArrowRight" && event.key !== "ArrowLeft") return;

    event.preventDefault();
    const chips = Array.from(chip.parentElement.querySelectorAll(".option-chip"));
    const direction = event.key === "ArrowRight" ? 1 : -1;
    const nextIndex = (chips.indexOf(chip) + direction + chips.length) % chips.length;
    chips[nextIndex].focus();
  });
  return chip;
}

function svgTextToImage(svgText) {
  return new Promise((resolve, reject) => {
    const image = new Image();
    const timer = window.setTimeout(() => {
      reject(new Error("SVG \u7d20\u6750\u8f7d\u5165\u8d85\u65f6"));
    }, 12000);

    image.onload = () => {
      window.clearTimeout(timer);
      resolve(image);
    };
    image.onerror = () => {
      window.clearTimeout(timer);
      reject(new Error("SVG \u7d20\u6750\u65e0\u6cd5\u8f6c\u6362\u4e3a\u56fe\u7247"));
    };
    image.src = `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svgText)}`;
  });
}

async function loadSvgText(url) {
  const response = await fetch(url);
  if (!response.ok) {
    throw new Error(`\u65e0\u6cd5\u8bfb\u53d6\u7d20\u6750\uff1a${url}`);
  }
  return response.text();
}

function getEmbeddedSvgText(url) {
  return window.SONG_BROCADE_ASSETS && window.SONG_BROCADE_ASSETS[url];
}

async function loadSvgImage(url, options = {}) {
  const embeddedSvgText = getEmbeddedSvgText(url);
  const svgText = embeddedSvgText || await loadSvgText(url);
  const image = await svgTextToImage(recolorSvgText(svgText, options));
  image.songBrocadeUrl = url;
  return image;
}

function getGroundSvgOptions() {
  return {
    ground: true,
    groundColor: state.groundColor,
    groundStrokeScale: state.groundStrokeScale,
  };
}

function normalizeGroundScale(value) {
  const scale = Number(value);
  if (!Number.isFinite(scale)) return 1;
  const clamped = Math.min(2.5, Math.max(0.5, scale));
  return Math.abs(clamped - 1) <= 0.05 ? 1 : clamped;
}

function applyGroundTypeValue(value) {
  if (value === "none") {
    state.drawGround = false;
    return;
  }

  state.drawGround = true;
  if (value === "random") {
    const weightedIndex = randomIndex(groundTextureMeta.length + 2);
    if (weightedIndex < 2) {
      state.drawGround = false;
      return;
    }
    state.idxGround = weightedIndex - 2;
    return;
  }

  const groundIndex = groundTextureMeta.findIndex((texture) => texture.file === value);
  state.idxGround = groundIndex >= 0 ? groundIndex : 0;
}

function getGroundTileSize(ground) {
  const imageWidth = ground.naturalWidth || ground.width;
  const imageHeight = ground.naturalHeight || ground.height;
  const sourceWidth = Number.isFinite(imageWidth) && imageWidth > 0 ? imageWidth : 100;
  const sourceHeight = Number.isFinite(imageHeight) && imageHeight > 0 ? imageHeight : sourceWidth;
  const scale = Number.isFinite(state.groundSize) && state.groundSize > 0 ? state.groundSize : 1;
  const tileWidth = Math.max(1, Math.round(sourceWidth * scale));
  const tileHeight = Math.max(1, Math.round(sourceHeight * scale));

  return { width: tileWidth, height: tileHeight };
}
